<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire d'éligibilité</title>
  
  <!-- Script Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    /* Style de base */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      box-sizing: border-box;
    }

    .form-container h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 24px;
      color: #1a202c;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #4a5568;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #3182ce;
    }

    /* Champ piège Honeypot (masqué pour l'utilisateur) */
    .hp-field {
      display: none !important;
    }

    .submit-btn {
      width: 100%;
      background-color: #3182ce;
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: #2b6cb0;
    }

    .submit-btn:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }

    /* Message de confirmation ou d'erreur */
    .form-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      text-align: center;
    }

    .form-msg.success {
      background-color: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }

    .form-msg.error {
      background-color: #fed7d7;
      color: #742a2a;
      border: 1px solid #feb2b2;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Vérification d'éligibilité</h2>
    
    <form id="eligibility-form">
      <!-- Champ piège Honeypot anti-spam -->
      <div class="hp-field">
        <label for="website">Ne pas remplir ce champ :</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" name="nom" required placeholder="Jean Dupont">
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" required placeholder="jean.dupont@example.com">
      </div>

      <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" name="telephone" required placeholder="06 12 34 56 78">
      </div>

      <!-- Widget Cloudflare Turnstile -->
      <!-- Remplacez "YOUR_TURNSTILE_SITE_KEY" par votre clé de site Turnstile -->
      <div class="form-group">
        <div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITE_KEY"></div>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">Vérifier mon éligibilité</button>
      
      <div id="form-msg" class="form-msg"></div>
    </form>
  </div>

  <script>
    (function() {
      // Remplacez cette URL par l'URL d'exécution de votre Google Apps Script
      const APPS_SCRIPT_URL = 'VOTRE_URL_GOOGLE_APPS_SCRIPT';
      
      let clientIP = '';

      // Récupération de l'adresse IP du client via un service public
      fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => { clientIP = data.ip; })
        .catch(err => console.warn('Impossible de récupérer l\'IP', err));

      const form = document.getElementById('eligibility-form');
      const submitBtn = document.getElementById('submit-btn');
      const formMsg = document.getElementById('form-msg');

      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();

          // Verification anti-bot (Honeypot)
          const hp = document.getElementById('website');
          if (hp && hp.value) {
            return; // Bloque la soumission s'il s'agit d'un bot
          }

          // Masquer les messages précédents et désactiver le bouton
          if (formMsg) {
            formMsg.className = 'form-msg';
            formMsg.style.display = 'none';
            formMsg.textContent = '';
          }
          submitBtn.disabled = true;
          submitBtn.textContent = 'Envoi en cours...';

          // Récupération des données du formulaire
          const formData = new FormData(form);
          const data = {};
          formData.forEach((value, key) => {
            data[key] = value;
          });

          // Ajout de l'IP du client si disponible
          if (clientIP) {
            data['IP'] = clientIP;
          }

          // Récupération du jeton Turnstile
          const turnstileToken = formData.get('cf-turnstile-response');
          if (turnstileToken) {
            data['cf-turnstile-response'] = turnstileToken;
          }

          // Envoi vers le web service Google Apps Script
          fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Évite les blocages CORS avec Apps Script
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
          })
          .then(() => {
            // Déclenchement de l'événement Lead sur Facebook Pixel si présent
            if (typeof fbq === 'function') {
              fbq('track', 'Lead');
            }

            // Affichage du message de confirmation
            if (formMsg) {
              formMsg.className = 'form-msg success';
              formMsg.style.display = 'block';
              formMsg.textContent = 'Votre demande d\'étude d\'éligibilité a bien été envoyée. Un conseiller vous contactera rapidement.';
            }
            form.reset();
            
            // Réinitialisation de Cloudflare Turnstile
            if (window.turnstile) {
              turnstile.reset();
            }
          })
          .catch((error) => {
            console.error('Erreur lors de l\'envoi :', error);
            if (formMsg) {
              formMsg.className = 'form-msg error';
              formMsg.style.display = 'block';
              formMsg.textContent = 'Une erreur est survenue lors de l\'envoi. Veuillez réessayer plus tard.';
            }
          })
          .finally(() => {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Vérifier mon éligibilité';
          });
        });
      }
    })();
  </script>
</body>
</html>
